version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Keep the two pins together: pytest-homeassistant-custom-component is
    # generated from one Home Assistant release. Update them in one pull.
    groups:
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
